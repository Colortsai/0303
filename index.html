<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>寶寶紀錄本</title>
<style>
  :root{
    --bg: #F6F3ED;
    --card: #FFFFFF;
    --ink: #2E2A26;
    --ink-soft: #7A7369;
    --line: #E7E1D6;
    --milk: #E8B7A0;      /* 親餵/瓶餵/配方奶 主色：柔陶橘 */
    --milk-deep: #C97E5F;
    --wet: #9BB6C9;       /* 尿布 主色：霧藍 */
    --wet-deep: #5C7E96;
    --warn: #C9584E;
    --warn-bg: #FBEAE7;
    --radius: 18px;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    -webkit-font-smoothing:antialiased;
    padding-bottom:40px;
  }
  header{
    padding:20px 18px 14px;
    position:sticky; top:0; z-index:20;
    background:var(--bg);
    border-bottom:1px solid var(--line);
  }
  .title-row{display:flex; align-items:baseline; justify-content:space-between;}
  h1{font-size:20px; margin:0; letter-spacing:0.02em;}
  h1 span{color:var(--milk-deep);}
  .date-picker{
    display:flex; align-items:center; gap:8px; margin-top:10px;
  }
  .date-picker button{
    border:none; background:var(--card); width:32px; height:32px; border-radius:10px;
    font-size:16px; color:var(--ink-soft); box-shadow:0 1px 2px rgba(0,0,0,0.06);
  }
  .date-picker input[type=date]{
    flex:1; border:1px solid var(--line); border-radius:10px; padding:6px 10px;
    font-size:15px; background:var(--card); color:var(--ink);
  }
  main{padding:16px;}
  .summary-card{
    background:var(--card); border-radius:var(--radius); padding:16px;
    box-shadow:0 2px 10px rgba(60,50,40,0.06); margin-bottom:18px;
  }
  .summary-card h2{margin:0 0 10px; font-size:14px; color:var(--ink-soft); font-weight:600;}
  .summary-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .summary-item{
    background:var(--bg); border-radius:12px; padding:10px 12px;
  }
  .summary-item .num{font-size:20px; font-weight:700;}
  .summary-item .lbl{font-size:12px; color:var(--ink-soft); margin-top:2px;}
  .summary-item.wide{grid-column:1 / -1;}
  .abnormal-list{margin-top:8px; font-size:13px; color:var(--warn); line-height:1.6;}

  .section-label{font-size:13px; color:var(--ink-soft); margin:20px 4px 10px; font-weight:600;}
  .action-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .action-btn{
    border:none; border-radius:var(--radius); padding:16px 10px;
    font-size:15px; font-weight:700; color:#fff; text-align:left;
    display:flex; flex-direction:column; gap:4px;
    box-shadow:0 3px 8px rgba(0,0,0,0.08);
  }
  .action-btn .emoji{font-size:22px;}
  .action-btn.feed{background:linear-gradient(135deg,var(--milk),var(--milk-deep));}
  .action-btn.spit{background:linear-gradient(135deg,#E2A0A0,#B85C5C); grid-column:1 / -1;}
  .action-btn.diaper{background:linear-gradient(135deg,var(--wet),var(--wet-deep)); grid-column:1 / -1;}

  .timeline{list-style:none; margin:0; padding:0;}
  .timeline li{
    background:var(--card); border-radius:14px; padding:12px 14px; margin-bottom:8px;
    display:flex; align-items:center; justify-content:space-between;
    box-shadow:0 1px 4px rgba(0,0,0,0.05);
  }
  .timeline .rec-main{display:flex; align-items:center; gap:10px;}
  .timeline .rec-emoji{font-size:20px;}
  .timeline .rec-text{font-size:14px;}
  .timeline .rec-text b{font-weight:700;}
  .timeline .rec-time{font-size:12px; color:var(--ink-soft); margin-top:2px;}
  .timeline .del-btn{border:none; background:none; color:var(--ink-soft); font-size:16px; padding:4px 8px;}
  .timeline .rec-abn{color:var(--warn); font-size:12px; margin-top:2px;}
  .empty{text-align:center; color:var(--ink-soft); font-size:13px; padding:30px 10px;}

  .backup-row{display:flex; gap:10px; margin-top:24px;}
  .backup-row button{
    flex:1; border:1px solid var(--line); background:var(--card); color:var(--ink-soft);
    border-radius:12px; padding:10px; font-size:13px;
  }

  /* Modal */
  .overlay{
    position:fixed; inset:0; background:rgba(30,25,20,0.4); z-index:50;
    display:flex; align-items:flex-end; justify-content:center;
    opacity:0; pointer-events:none; transition:opacity .2s;
  }
  .overlay.open{opacity:1; pointer-events:auto;}
  .sheet{
    background:var(--card); width:100%; max-width:480px;
    border-radius:22px 22px 0 0; padding:20px 18px 26px;
    transform:translateY(20px); transition:transform .25s;
    max-height:85vh; overflow-y:auto;
  }
  .overlay.open .sheet{transform:translateY(0);}
  .sheet h3{margin:0 0 14px; font-size:17px;}
  .field{margin-bottom:16px;}
  .field label{display:block; font-size:13px; color:var(--ink-soft); margin-bottom:6px;}
  .chip-row{display:flex; gap:8px; flex-wrap:wrap;}
  .chip{
    border:1.5px solid var(--line); background:var(--bg); border-radius:999px;
    padding:8px 16px; font-size:14px; color:var(--ink);
  }
  .chip.active{border-color:var(--milk-deep); background:var(--milk); color:#fff;}
  .chip.active.wet-chip{border-color:var(--wet-deep); background:var(--wet);}
  .chip.active.warn-chip{border-color:var(--warn); background:var(--warn-bg); color:var(--warn);}
  .stepper{display:flex; align-items:center; gap:14px;}
  .stepper button{
    width:40px; height:40px; border-radius:50%; border:none; background:var(--bg);
    font-size:20px; color:var(--milk-deep);
  }
  .stepper input{
    width:70px; text-align:center; font-size:20px; border:none; background:none; color:var(--ink);
  }
  .timer-row{display:flex; align-items:center; gap:10px;}
  .timer-row button{
    border:none; border-radius:12px; padding:10px 14px; font-size:13px; color:#fff;
    background:var(--milk-deep);
  }
  .timer-display{font-size:20px; font-weight:700; font-variant-numeric:tabular-nums;}
  textarea, .datetime-input{
    width:100%; border:1px solid var(--line); border-radius:10px; padding:10px;
    font-size:14px; font-family:inherit; background:var(--bg); color:var(--ink);
  }
  .sheet-actions{display:flex; gap:10px; margin-top:6px;}
  .sheet-actions button{flex:1; border:none; border-radius:12px; padding:13px; font-size:15px; font-weight:700;}
  .btn-cancel{background:var(--bg); color:var(--ink-soft);}
  .btn-save{background:var(--milk-deep); color:#fff;}
</style>
</head>
<body>

<header>
  <div class="title-row">
    <h1>寶寶<span>紀錄本</span></h1>
    <button id="settingsBtn" style="border:none;background:none;font-size:20px;color:var(--ink-soft);">⚙️</button>
  </div>
  <div id="syncStatus" style="font-size:11px;color:var(--ink-soft);margin-top:2px;"></div>
  <div class="date-picker">
    <button id="prevDay">‹</button>
    <input type="date" id="dateInput">
    <button id="nextDay">›</button>
  </div>
</header>

<main>
  <div class="summary-card">
    <h2 id="summaryTitle">今日總結</h2>
    <div class="summary-grid" id="summaryGrid"></div>
    <div class="abnormal-list" id="abnormalList"></div>
  </div>

  <div class="section-label">新增紀錄</div>
  <div class="action-grid">
    <button class="action-btn feed" data-type="親餵"><span class="emoji">🤱</span>親餵</button>
    <button class="action-btn feed" data-type="瓶餵"><span class="emoji">🍼</span>瓶餵</button>
    <button class="action-btn spit"><span class="emoji">🤮</span>溢奶／吐奶</button>
    <button class="action-btn diaper" data-type="diaper"><span class="emoji">🧷</span>換尿布</button>
  </div>

  <div class="section-label" id="timelineLabel">今日紀錄</div>
  <ul class="timeline" id="timeline"></ul>
  <div class="empty" id="emptyState" style="display:none;">還沒有紀錄，點上面的按鈕開始記錄吧</div>

  <div class="backup-row">
    <button id="exportBtn">匯出備份 (JSON)</button>
    <button id="importBtn">匯入備份</button>
  </div>
  <input type="file" id="importFile" accept="application/json" style="display:none;">

<!-- Spit-up modal -->
<div class="overlay" id="spitOverlay">
  <div class="sheet">
    <h3>溢奶／吐奶</h3>
    <div class="field">
      <label>類型</label>
      <div class="chip-row" id="spitTypeChips">
        <button type="button" class="chip warn-chip" data-val="溢奶">溢奶</button>
        <button type="button" class="chip warn-chip" data-val="吐奶">吐奶</button>
      </div>
    </div>
    <div class="field" id="spitSubtypeField" style="display:none;">
      <label>吐奶方式</label>
      <div class="chip-row" id="spitSubtypeChips">
        <button type="button" class="chip warn-chip" data-val="一般吐奶">一般吐奶</button>
        <button type="button" class="chip warn-chip" data-val="噴射性吐奶">噴射性吐奶</button>
      </div>
    </div>
    <div class="field">
      <label>異常狀態（可複選，無異常請留空）</label>
      <div class="chip-row" id="spitAbnormalChips">
        <button type="button" class="chip warn-chip" data-val="咖啡色">咖啡色</button>
        <button type="button" class="chip warn-chip" data-val="綠色">綠色</button>
        <button type="button" class="chip warn-chip" data-val="血絲">血絲</button>
        <button type="button" class="chip warn-chip" data-val="黃色">黃色</button>
      </div>
    </div>
    <div class="field">
      <label>其他症狀（選填）</label>
      <textarea id="spitOtherNote" rows="2" placeholder="例如：合併發燒、食慾不振..."></textarea>
    </div>
    <div class="field">
      <label>時間</label>
      <input type="datetime-local" class="datetime-input" id="spitTime">
    </div>
    <div class="sheet-actions">
      <button class="btn-cancel" id="spitCancel">取消</button>
      <button class="btn-save" id="spitSave">儲存</button>
    </div>
  </div>
</div>

<!-- Settings modal -->
<div class="overlay" id="settingsOverlay">
  <div class="sheet">
    <h3>雲端同步設定</h3>
    <div class="field">
      <label>Google Apps Script 網址（貼上部署後的 Web App URL）</label>
      <textarea id="syncUrlInput" rows="3" placeholder="https://script.google.com/macros/s/.../exec"></textarea>
    </div>
    <div class="field" style="font-size:12px;color:var(--ink-soft);line-height:1.6;">
      設定後，每筆新增/刪除的紀錄會自動同步到你的 Google Sheet，其他裝置打開這個網頁、貼上同一組網址，也能看到相同資料。
    </div>
    <div class="sheet-actions">
      <button class="btn-cancel" id="settingsCancel">取消</button>
      <button class="btn-save" id="settingsSave">儲存並同步</button>
    </div>
  </div>
</div>
</main>

<!-- Feed modal -->
<div class="overlay" id="feedOverlay">
  <div class="sheet">
    <h3 id="feedTitle">親餵</h3>
    <div class="field" id="durationField">
      <label>餵了多久（分鐘）</label>
      <div class="stepper">
        <button type="button" id="durMinus">－</button>
        <input type="number" id="durValue" value="10">
        <button type="button" id="durPlus">＋</button>
      </div>
      <div class="timer-row" style="margin-top:12px;">
        <button type="button" id="timerToggle">開始計時</button>
        <span class="timer-display" id="timerDisplay">00:00</span>
      </div>
    </div>
    <div class="field" id="amountField" style="display:none;">
      <label>種類</label>
      <div class="chip-row" id="bottleContentChips" style="margin-bottom:14px;">
        <button type="button" class="chip" data-val="母奶">🍼 母奶</button>
        <button type="button" class="chip" data-val="配方奶">🍶 配方奶</button>
      </div>
      <label>奶量（ml）</label>
      <div class="stepper">
        <button type="button" id="amtMinus">－</button>
        <input type="number" id="amtValue" value="60">
        <button type="button" id="amtPlus">＋</button>
      </div>
    </div>
    <div class="field">
      <label>時間</label>
      <input type="datetime-local" class="datetime-input" id="feedTime">
    </div>
    <div class="sheet-actions">
      <button class="btn-cancel" id="feedCancel">取消</button>
      <button class="btn-save" id="feedSave">儲存</button>
    </div>
  </div>
</div>

<!-- Diaper modal -->
<div class="overlay" id="diaperOverlay">
  <div class="sheet">
    <h3>換尿布</h3>
    <div class="field">
      <label>類型（可複選）</label>
      <div class="chip-row" id="diaperTypeChips">
        <button type="button" class="chip wet-chip" data-val="小便">💧 小便</button>
        <button type="button" class="chip wet-chip" data-val="大便">💩 大便</button>
      </div>
    </div>
    <div class="field">
      <label>有無異常</label>
      <div class="chip-row" id="abnormalChips">
        <button type="button" class="chip wet-chip" data-val="no">正常</button>
        <button type="button" class="chip wet-chip" data-val="yes">異常</button>
      </div>
    </div>
    <div class="field" id="abnormalNoteField" style="display:none;">
      <label>異常狀態說明</label>
      <textarea id="abnormalNote" rows="3" placeholder="例如：綠便、血絲、腹瀉、疹子..."></textarea>
    </div>
    <div class="field">
      <label>時間</label>
      <input type="datetime-local" class="datetime-input" id="diaperTime">
    </div>
    <div class="sheet-actions">
      <button class="btn-cancel" id="diaperCancel">取消</button>
      <button class="btn-save" id="diaperSave">儲存</button>
    </div>
  </div>
</div>

<script>
(function(){
  const STORAGE_KEY = 'babylog-records-v1';
  const SYNC_URL_KEY = 'babylog-sync-url';

  function loadRecords(){
    try{ return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
    catch(e){ return []; }
  }
  function saveRecords(recs){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(recs));
  }
  let records = loadRecords();

  // ---- cloud sync (Google Apps Script web app) ----
  function getSyncUrl(){ return localStorage.getItem(SYNC_URL_KEY) || ''; }
  const syncStatus = document.getElementById('syncStatus');
  function setStatus(msg){ syncStatus.textContent = msg; }

  function syncPush(record){
    const url = getSyncUrl();
    if(!url) return;
    setStatus('同步中…');
    fetch(url, {
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({ action:'add', record })
    }).then(()=> setStatus('已同步 ✓'))
      .catch(()=> setStatus('同步失敗，稍後會自動重試'));
  }
  function syncDelete(id){
    const url = getSyncUrl();
    if(!url) return;
    fetch(url, {
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({ action:'delete', id })
    }).catch(()=>{});
  }
  function syncPullAndMerge(){
    const url = getSyncUrl();
    if(!url) return;
    setStatus('讀取雲端資料中…');
    fetch(url)
      .then(r=>r.json())
      .then(remote=>{
        const localIds = new Set(records.map(r=>r.id));
        const remoteIds = new Set(remote.map(r=>r.id));
        // add remote records not present locally
        remote.forEach(r=>{ if(!localIds.has(r.id)) records.push(r); });
        // push local records not present remotely (created offline)
        records.forEach(r=>{ if(!remoteIds.has(r.id)) syncPush(r); });
        saveRecords(records);
        render();
        setStatus('已同步 ✓');
      })
      .catch(()=> setStatus('無法連線到雲端，顯示本機資料'));
  }

  // settings modal
  const settingsOverlay = document.getElementById('settingsOverlay');
  const syncUrlInput = document.getElementById('syncUrlInput');
  document.getElementById('settingsBtn').onclick = ()=>{
    syncUrlInput.value = getSyncUrl();
    openOverlayGeneric(settingsOverlay);
  };
  document.getElementById('settingsCancel').onclick = ()=> settingsOverlay.classList.remove('open');
  document.getElementById('settingsSave').onclick = ()=>{
    const url = syncUrlInput.value.trim();
    localStorage.setItem(SYNC_URL_KEY, url);
    settingsOverlay.classList.remove('open');
    if(url) syncPullAndMerge();
    else setStatus('');
  };
  function openOverlayGeneric(el){ el.classList.add('open'); }

  function pad(n){ return String(n).padStart(2,'0'); }
  function toDateKey(d){ return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
  function nowLocalInputValue(){
    const d = new Date();
    return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }

  // ---- date navigation ----
  const dateInput = document.getElementById('dateInput');
  dateInput.value = toDateKey(new Date());

  document.getElementById('prevDay').onclick = () => shiftDate(-1);
  document.getElementById('nextDay').onclick = () => shiftDate(1);
  function shiftDate(delta){
    const d = new Date(dateInput.value + 'T00:00:00');
    d.setDate(d.getDate()+delta);
    dateInput.value = toDateKey(d);
    render();
  }
  dateInput.addEventListener('change', render);

  // ---- feed modal state ----
  const feedOverlay = document.getElementById('feedOverlay');
  const feedTitle = document.getElementById('feedTitle');
  const durationField = document.getElementById('durationField');
  const amountField = document.getElementById('amountField');
  const durValue = document.getElementById('durValue');
  const amtValue = document.getElementById('amtValue');
  const feedTime = document.getElementById('feedTime');
  let currentFeedType = null;
  let bottleContent = '母奶';
  let timerInterval = null, timerSeconds = 0, timerRunning = false;

  document.querySelectorAll('.action-btn.feed').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      currentFeedType = btn.dataset.type;
      feedTitle.textContent = currentFeedType;
      resetTimer();
      if(currentFeedType === '親餵'){
        durationField.style.display = 'block';
        amountField.style.display = 'none';
      } else {
        durationField.style.display = 'none';
        amountField.style.display = 'block';
        bottleContent = '母奶';
        updateBottleContentChips();
        amtValue.value = 60;
      }
      feedTime.value = nowLocalInputValue();
      openOverlay(feedOverlay);
    });
  });

  const bottleContentChips = document.getElementById('bottleContentChips');
  bottleContentChips.querySelectorAll('.chip').forEach(chip=>{
    chip.addEventListener('click', ()=>{
      bottleContent = chip.dataset.val;
      updateBottleContentChips();
      amtValue.value = bottleContent === '配方奶' ? 90 : 60;
    });
  });
  function updateBottleContentChips(){
    bottleContentChips.querySelectorAll('.chip').forEach(chip=>{
      chip.classList.toggle('active', chip.dataset.val === bottleContent);
    });
  }

  document.getElementById('durMinus').onclick = ()=> durValue.value = Math.max(0, (+durValue.value||0) - 1);
  document.getElementById('durPlus').onclick = ()=> durValue.value = (+durValue.value||0) + 1;
  document.getElementById('amtMinus').onclick = ()=> amtValue.value = Math.max(0, (+amtValue.value||0) - 10);
  document.getElementById('amtPlus').onclick = ()=> amtValue.value = (+amtValue.value||0) + 10;

  const timerToggle = document.getElementById('timerToggle');
  const timerDisplay = document.getElementById('timerDisplay');
  function resetTimer(){
    clearInterval(timerInterval);
    timerInterval = null; timerSeconds = 0; timerRunning = false;
    timerDisplay.textContent = '00:00';
    timerToggle.textContent = '開始計時';
  }
  timerToggle.onclick = ()=>{
    if(!timerRunning){
      timerRunning = true;
      timerToggle.textContent = '停止計時';
      timerInterval = setInterval(()=>{
        timerSeconds++;
        const m = Math.floor(timerSeconds/60), s = timerSeconds%60;
        timerDisplay.textContent = `${pad(m)}:${pad(s)}`;
      },1000);
    } else {
      timerRunning = false;
      clearInterval(timerInterval);
      timerToggle.textContent = '開始計時';
      durValue.value = Math.max(1, Math.round(timerSeconds/60));
    }
  };

  document.getElementById('feedCancel').onclick = ()=> closeOverlay(feedOverlay);
  document.getElementById('feedSave').onclick = ()=>{
    const ts = feedTime.value ? new Date(feedTime.value).toISOString() : new Date().toISOString();
    const rec = {
      id: Date.now()+'-'+Math.random().toString(36).slice(2,7),
      category: 'feed',
      feedType: currentFeedType,
      ts
    };
    if(currentFeedType === '親餵'){
      rec.minutes = Math.max(0, +durValue.value || 0);
    } else {
      rec.ml = Math.max(0, +amtValue.value || 0);
      rec.bottleContent = bottleContent;
    }
    records.push(rec);
    saveRecords(records);
    syncPush(rec);
    closeOverlay(feedOverlay);
    render();
  };

  // ---- diaper modal state ----
  const diaperOverlay = document.getElementById('diaperOverlay');
  const diaperTypeChips = document.getElementById('diaperTypeChips');
  const abnormalChips = document.getElementById('abnormalChips');
  const abnormalNoteField = document.getElementById('abnormalNoteField');
  const abnormalNote = document.getElementById('abnormalNote');
  const diaperTime = document.getElementById('diaperTime');
  let selectedDiaperTypes = new Set();
  let abnormalState = 'no';

  document.querySelector('.action-btn.diaper').addEventListener('click', ()=>{
    selectedDiaperTypes = new Set();
    abnormalState = 'no';
    abnormalNote.value = '';
    updateDiaperChips();
    updateAbnormalChips();
    diaperTime.value = nowLocalInputValue();
    openOverlay(diaperOverlay);
  });

  diaperTypeChips.querySelectorAll('.chip').forEach(chip=>{
    chip.addEventListener('click', ()=>{
      const v = chip.dataset.val;
      if(selectedDiaperTypes.has(v)) selectedDiaperTypes.delete(v);
      else selectedDiaperTypes.add(v);
      updateDiaperChips();
    });
  });
  function updateDiaperChips(){
    diaperTypeChips.querySelectorAll('.chip').forEach(chip=>{
      chip.classList.toggle('active', selectedDiaperTypes.has(chip.dataset.val));
    });
  }

  abnormalChips.querySelectorAll('.chip').forEach(chip=>{
    chip.addEventListener('click', ()=>{
      abnormalState = chip.dataset.val;
      updateAbnormalChips();
      abnormalNoteField.style.display = abnormalState === 'yes' ? 'block' : 'none';
    });
  });
  function updateAbnormalChips(){
    abnormalChips.querySelectorAll('.chip').forEach(chip=>{
      chip.classList.toggle('active', chip.dataset.val === abnormalState);
    });
  }

  document.getElementById('diaperCancel').onclick = ()=> closeOverlay(diaperOverlay);
  document.getElementById('diaperSave').onclick = ()=>{
    if(selectedDiaperTypes.size === 0){
      alert('請至少選擇一種類型（大便／小便）');
      return;
    }
    const ts = diaperTime.value ? new Date(diaperTime.value).toISOString() : new Date().toISOString();
    const rec = {
      id: Date.now()+'-'+Math.random().toString(36).slice(2,7),
      category: 'diaper',
      diaperTypes: Array.from(selectedDiaperTypes),
      abnormal: abnormalState === 'yes',
      abnormalNote: abnormalState === 'yes' ? abnormalNote.value.trim() : '',
      ts
    };
    records.push(rec);
    saveRecords(records);
    syncPush(rec);
    closeOverlay(diaperOverlay);
    render();
  };

  function openOverlay(el){ el.classList.add('open'); }
  function closeOverlay(el){ el.classList.remove('open'); resetTimer(); }

  // ---- spit-up modal state ----
  const spitOverlay = document.getElementById('spitOverlay');
  const spitTypeChips = document.getElementById('spitTypeChips');
  const spitSubtypeField = document.getElementById('spitSubtypeField');
  const spitSubtypeChips = document.getElementById('spitSubtypeChips');
  const spitAbnormalChips = document.getElementById('spitAbnormalChips');
  const spitOtherNote = document.getElementById('spitOtherNote');
  const spitTime = document.getElementById('spitTime');
  let selectedSpitType = null;
  let selectedSpitSubtype = null;
  let selectedSpitAbnormal = new Set();

  document.querySelector('.action-btn.spit').addEventListener('click', ()=>{
    selectedSpitType = null;
    selectedSpitSubtype = null;
    selectedSpitAbnormal = new Set();
    spitOtherNote.value = '';
    spitSubtypeField.style.display = 'none';
    updateSpitTypeChips();
    updateSpitSubtypeChips();
    updateSpitAbnormalChips();
    spitTime.value = nowLocalInputValue();
    openOverlay(spitOverlay);
  });

  spitTypeChips.querySelectorAll('.chip').forEach(chip=>{
    chip.addEventListener('click', ()=>{
      selectedSpitType = chip.dataset.val;
      updateSpitTypeChips();
      spitSubtypeField.style.display = selectedSpitType === '吐奶' ? 'block' : 'none';
      if(selectedSpitType !== '吐奶') selectedSpitSubtype = null;
      updateSpitSubtypeChips();
    });
  });
  function updateSpitTypeChips(){
    spitTypeChips.querySelectorAll('.chip').forEach(chip=>{
      chip.classList.toggle('active', chip.dataset.val === selectedSpitType);
    });
  }

  spitSubtypeChips.querySelectorAll('.chip').forEach(chip=>{
    chip.addEventListener('click', ()=>{
      selectedSpitSubtype = chip.dataset.val;
      updateSpitSubtypeChips();
    });
  });
  function updateSpitSubtypeChips(){
    spitSubtypeChips.querySelectorAll('.chip').forEach(chip=>{
      chip.classList.toggle('active', chip.dataset.val === selectedSpitSubtype);
    });
  }

  spitAbnormalChips.querySelectorAll('.chip').forEach(chip=>{
    chip.addEventListener('click', ()=>{
      const v = chip.dataset.val;
      if(selectedSpitAbnormal.has(v)) selectedSpitAbnormal.delete(v);
      else selectedSpitAbnormal.add(v);
      updateSpitAbnormalChips();
    });
  });
  function updateSpitAbnormalChips(){
    spitAbnormalChips.querySelectorAll('.chip').forEach(chip=>{
      chip.classList.toggle('active', selectedSpitAbnormal.has(chip.dataset.val));
    });
  }

  document.getElementById('spitCancel').onclick = ()=> closeOverlay(spitOverlay);
  document.getElementById('spitSave').onclick = ()=>{
    if(!selectedSpitType){
      alert('請選擇「溢奶」或「吐奶」');
      return;
    }
    if(selectedSpitType === '吐奶' && !selectedSpitSubtype){
      alert('請選擇吐奶方式（一般吐奶／噴射性吐奶）');
      return;
    }
    const ts = spitTime.value ? new Date(spitTime.value).toISOString() : new Date().toISOString();
    const abnormalTypes = Array.from(selectedSpitAbnormal);
    const note = spitOtherNote.value.trim();
    const rec = {
      id: Date.now()+'-'+Math.random().toString(36).slice(2,7),
      category: 'spitup',
      spitType: selectedSpitType,
      spitSubtype: selectedSpitType === '吐奶' ? selectedSpitSubtype : '',
      abnormalTypes,
      abnormal: abnormalTypes.length > 0 || note !== '',
      abnormalNote: note,
      ts
    };
    records.push(rec);
    saveRecords(records);
    syncPush(rec);
    closeOverlay(spitOverlay);
    render();
  };

  // ---- delete ----
  function deleteRecord(id){
    records = records.filter(r=>r.id!==id);
    saveRecords(records);
    syncDelete(id);
    render();
  }

  // ---- render ----
  const timeline = document.getElementById('timeline');
  const emptyState = document.getElementById('emptyState');
  const summaryGrid = document.getElementById('summaryGrid');
  const summaryTitle = document.getElementById('summaryTitle');
  const timelineLabel = document.getElementById('timelineLabel');
  const abnormalListEl = document.getElementById('abnormalList');

  function render(){
    const dateKey = dateInput.value;
    const dayRecords = records
      .filter(r => toDateKey(new Date(r.ts)) === dateKey)
      .sort((a,b)=> new Date(a.ts) - new Date(b.ts));

    const isToday = dateKey === toDateKey(new Date());
    summaryTitle.textContent = isToday ? '今日總結' : `${dateKey} 總結`;
    timelineLabel.textContent = isToday ? '今日紀錄' : `${dateKey} 紀錄`;

    // summary calc
    let breastCount=0, breastMin=0, bottleCount=0, bottleMl=0, formulaCount=0, formulaMl=0;
    let peeCount=0, pooCount=0;
    let spitCount=0, normalVomitCount=0, jetVomitCount=0;
    const abnormalEntries = [];

    dayRecords.forEach(r=>{
      if(r.category==='feed'){
        if(r.feedType==='親餵'){ breastCount++; breastMin += (r.minutes||0); }
        else if(r.feedType==='瓶餵'){
          if(r.bottleContent === '配方奶'){ formulaCount++; formulaMl += (r.ml||0); }
          else { bottleCount++; bottleMl += (r.ml||0); }
        }
        else if(r.feedType==='配方奶'){ formulaCount++; formulaMl += (r.ml||0); } // 舊資料相容
      } else if(r.category==='diaper'){
        if(r.diaperTypes.includes('小便')) peeCount++;
        if(r.diaperTypes.includes('大便')) pooCount++;
        if(r.abnormal){
          const t = new Date(r.ts);
          abnormalEntries.push(`⚠️ ${pad(t.getHours())}:${pad(t.getMinutes())}（尿布）— ${r.abnormalNote || '（未填寫說明）'}`);
        }
      } else if(r.category==='spitup'){
        if(r.spitType === '溢奶') spitCount++;
        else if(r.spitType === '吐奶'){
          if(r.spitSubtype === '噴射性吐奶') jetVomitCount++;
          else normalVomitCount++;
        }
        if(r.abnormal){
          const t = new Date(r.ts);
          const tags = (r.abnormalTypes||[]).join('、');
          const parts = [tags, r.abnormalNote].filter(Boolean).join('，');
          abnormalEntries.push(`⚠️ ${pad(t.getHours())}:${pad(t.getMinutes())}（${r.spitType}）— ${parts || '（未填寫說明）'}`);
        }
      }
    });

    summaryGrid.innerHTML = `
      <div class="summary-item"><div class="num">${breastCount} 次</div><div class="lbl">親餵（共 ${breastMin} 分鐘）</div></div>
      <div class="summary-item"><div class="num">${bottleCount} 次</div><div class="lbl">瓶餵母奶（共 ${bottleMl} ml）</div></div>
      <div class="summary-item"><div class="num">${formulaCount} 次</div><div class="lbl">配方奶（共 ${formulaMl} ml）</div></div>
      <div class="summary-item"><div class="num">${peeCount + pooCount} 次</div><div class="lbl">換尿布（小便 ${peeCount}／大便 ${pooCount}）</div></div>
      <div class="summary-item wide"><div class="num">${spitCount + normalVomitCount + jetVomitCount} 次</div><div class="lbl">溢奶／吐奶（溢奶 ${spitCount}／一般吐奶 ${normalVomitCount}／噴射性吐奶 ${jetVomitCount}）</div></div>
    `;
    abnormalListEl.innerHTML = abnormalEntries.length
      ? abnormalEntries.map(t=>`<div>${t}</div>`).join('')
      : '';

    // timeline
    timeline.innerHTML = '';
    emptyState.style.display = dayRecords.length ? 'none' : 'block';
    dayRecords.slice().reverse().forEach(r=>{
      const li = document.createElement('li');
      const t = new Date(r.ts);
      const timeStr = `${pad(t.getHours())}:${pad(t.getMinutes())}`;
      let emoji='', text='', abnHtml='';
      if(r.category==='feed'){
        if(r.feedType==='親餵'){ emoji='🤱'; text=`<b>親餵</b> ${r.minutes} 分鐘`; }
        else if(r.feedType==='瓶餵'){
          const content = r.bottleContent || '母奶';
          emoji = content === '配方奶' ? '🍶' : '🍼';
          text=`<b>瓶餵（${content}）</b> ${r.ml} ml`;
        }
        else { emoji='🍶'; text=`<b>配方奶</b> ${r.ml} ml`; } // 舊資料相容
      } else if(r.category==='diaper'){
        emoji='🧷';
        text=`<b>換尿布</b> ${r.diaperTypes.join('、')}`;
        if(r.abnormal) abnHtml = `<div class="rec-abn">⚠️ ${r.abnormalNote || '異常（未填寫說明）'}</div>`;
      } else if(r.category==='spitup'){
        emoji='🤮';
        const label = r.spitType === '吐奶' ? `吐奶（${r.spitSubtype}）` : '溢奶';
        text=`<b>${label}</b>`;
        if(r.abnormal){
          const tags = (r.abnormalTypes||[]).join('、');
          const parts = [tags, r.abnormalNote].filter(Boolean).join('，');
          abnHtml = `<div class="rec-abn">⚠️ ${parts || '異常（未填寫說明）'}</div>`;
        }
      }
      li.innerHTML = `
        <div class="rec-main">
          <div class="rec-emoji">${emoji}</div>
          <div>
            <div class="rec-text">${text}</div>
            <div class="rec-time">${timeStr}</div>
            ${abnHtml}
          </div>
        </div>
        <button class="del-btn" data-id="${r.id}">✕</button>
      `;
      timeline.appendChild(li);
    });
    timeline.querySelectorAll('.del-btn').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        if(confirm('刪除這筆紀錄？')) deleteRecord(btn.dataset.id);
      });
    });
  }

  // ---- backup / restore ----
  document.getElementById('exportBtn').onclick = ()=>{
    const blob = new Blob([JSON.stringify(records, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `babylog-backup-${toDateKey(new Date())}.json`;
    a.click();
    URL.revokeObjectURL(url);
  };
  document.getElementById('importBtn').onclick = ()=> document.getElementById('importFile').click();
  document.getElementById('importFile').addEventListener('change', (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ()=>{
      try{
        const imported = JSON.parse(reader.result);
        if(!Array.isArray(imported)) throw new Error('格式錯誤');
        if(confirm(`匯入 ${imported.length} 筆紀錄？這會與現有資料合併（不會覆蓋）。`)){
          const existingIds = new Set(records.map(r=>r.id));
          imported.forEach(r=>{ if(!existingIds.has(r.id)) records.push(r); });
          saveRecords(records);
          render();
          alert('匯入完成！');
        }
      }catch(err){
        alert('匯入失敗，請確認是正確的備份檔案');
      }
    };
    reader.readAsText(file);
    e.target.value = '';
  });

  render();
  if(getSyncUrl()) syncPullAndMerge();
})();
</script>
</body>
</html>
